## 一、 技術物理限制與超前 18-24 個月洗牌框架

本板塊目前並無登錄任何世代規格（Current/Next/Future Generation 皆為 N/A），故本研究嚴格摒棄 GPU 或先進邏輯晶片的世代替代框架，純粹以「循環經濟技術迭代」與「製程整合替代風險」的視角，建立未來 18-24 個月的技術洗牌框架。

隨著半導體製造邁向埃米級節點與異質整合，材料消耗量呈指數級上升（如 EUV 光阻液、高純度化學品、貴金屬靶材）。在物理極限與成本極限的雙重擠壓下，材料回收的技術門檻已從「末端廢水廢氣處理」強制升級為「高純度再生與原級循環」。未來 24 個月，板塊將面臨以下物理限制驅動的洗牌：
1. **純度極限壁壘：** 先進製程對金屬雜質極端敏感，再生材料必須達到 G5/G6 等級（10ppt 以下金屬雜質）方能回用主製程，缺乏高純度純化技術的廠商將被物理性淘汰。
2. **碳足跡法規硬約束：** 歐盟 CSRD 等 ESG 法規迫使晶圓廠導入源頭分類與線上純化系統，可回收再利用比例須從 30% 提升至 80% 以上，傳統「末端焚化與固化處理」將因無法符合碳排標準而失去進料來源。

## 二、 供應鏈內容價值 正反面推演與下世代替代風險警告

在無世代演進的框架下，本板塊的 Content Value (CV) 洗牌將以「製程端線上回收替代末端處理」為核心主軸。

### （一）正面：CV 暴漲的廠商類別
1. **高純度化學品原級再生供應商：**
   能將廢液純化至 G5/G6 等級並直接賣回給晶圓廠的廠商，其 CV 從「廢水處理費收入」躍升為「取代原物料採購額」。預期此類廠商的利潤率與 CV 佔比將迎來 **+150% 至 +200%** 的結構性暴漲。
2. **貴金屬與稀土靶材閉環回收商：**
   能深入封裝廠與晶圓廠提供「靶材租賃+廢靶材回收再生」閉環服務的廠商，因掌握稀有金屬（銅、鈀、釕）的二次供給源，其在供應鏈中的話語權與 CV 預期將提升 **+80% 至 +120%**。

### （二）反面：面臨 CV 暴跌或歸零的競爭替代風險
1. **傳統「末端焚化與固化處理」廠商（CV 歸零風險）：**
   隨著線上純化系統攔截 80% 以上廢液，傳統依賴「收取高額廢棄物處理費」的環保廠商，其進料量將斷崖式下跌，預期其 CV 將面臨 **-100% 歸零風險**，直接被踢出供應鏈。
2. **低階金屬廢料萃取商（CV 暴跌風險）：**
   缺乏高純度純化技術的初階萃取商，其產出的粗金屬將失去市場溢價，預期其 CV 將被壓縮 **-60% 至 -80%**，跌至原物料期貨價格以下。

### （三）Design Win 試產放量時程：設備端領先材料端的關鍵時間差
在材料回收板塊中，「設備端」指線上純化設備；「材料端」指再生化學品或再生靶材。設備端必然領先材料端，其關鍵時間差錨點如下：
*   **T0（設備端 Design Win）：** 晶圓廠建廠階段（量產前 9-12 個月），線上純化設備裝機交貨，設備商營收先爆發。
*   **T+3 至 T+6 個月（試產與驗證期）：** 純化設備產出第一批再生化學品，進入長達 3-6 個月的嚴苛純度驗證。
*   **T+9 個月（材料端 Design Win）：** 再生化學品通過 G5/G6 等級驗證，正式導入主製程，材料供應商開始認列穩定收入。

**供應鏈策略意涵：** 掌握設備端 Design Win 等於鎖定未來材料端的 CV。由於線上純化設備客製化極高，一旦導入將形成排他性，未來 CV 將高度向「設備+材料一條龍」的解決方案提供商集中。

## 四、 預期差與共識度 過濾操作策略

基於行為金融學與財經媒體炒作週期視角，本板塊呈現顯著的「強者恆強、弱者恆弱」的 K 型分化。然而，依據誠實化規則，本次無任何公司通過黃金潛伏門檻（\`is_golden_accumulation_target\` 皆為 False），故全數列為**觀察名單（未過共識門檻）**。

### （一）排除共識標的：媒體過度定價與下世代替代風險
**1785 光洋科** 真實營收 YoY 高達 +95.47%，為媒體與法人高度共識的焦點。從行為金融學角度，這正是預期差被消耗殆盡的危險區：
1. **敘事包裝與籌碼陷阱：** 媒體敘事已進入「兌現期」，將其營收成長直接與先進封裝畫上等號。高共識意味著籌碼高度集中，若 2026-10 月營收公佈未能超越 +128.88% 的機械外推情境（末值 × 固定加速係數，非模型預測），將觸發「利好出盡」賣壓。
2. **下世代替代風險危機：** 1785 光洋科雖具備高 CV，但若未能補足「線上純化設備」客製化能力，一旦國際大廠在晶圓廠端導入閉環回收系統，將面臨「進料量斷崖式下跌」的替代風險。市場目前給予的高估值，完全未對此「製程端線上回收」的 CV 暴跌風險定價。

### （二）觀察名單與觸發條件：3663 鑫科的 Storytelling 傳導
**3663 鑑科**（共識度 77，粗粒度：12 檔樣本，±8 分為雜訊）目前真實營收 YoY 為 -13.86%，與板塊高頻價格指數（+5.48%）呈現嚴重背離。此「基本面落後 + 媒體冷落」狀態，正是財經 Storytelling 醞釀預期差的溫床。以下為未來 2-3 個月新聞傳導路徑模擬與觀察觸發點：

1. **【T+0 至 T+1 個月】無人關注的冷門期（目前所處階段）：**
