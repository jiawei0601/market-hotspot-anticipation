## 一、 技術物理限制與超前 18-24 個月 (Feynman_Next) 洗牌框架

當前 AI 資料中心正處於「氣冷轉液冷」的架構重構元年。隨著 GPU 熱功耗密度（TDP）呈現非線性躍升，散熱已從「支撐算力的基礎」轉變為「定義系統架構的核心」。本報告以三個世代為座標，建立物理限制與供應鏈洗牌的推演框架：

1.  **Vera Rubin (當前世代 T+0)**：單顆 GPU TDP 逼近 **1000W+**，機櫃級功耗達 40kW-60kW。氣冷尚能作為邊緣節點輔助，液冷標準化（如 UQDB 通用快接頭）於此階段確立。
2.  **Feynman (下一代架構 T+12~18 個月)**：單顆 GPU TDP 躍升至 **1200W-1500W**，單機櫃功耗突破 **80kW-100kW**。傳統機房冷水主機無法應對瞬間熱衝擊，機櫃級側邊液冷列與冷量分配單元成為標配。
3.  **Feynman_Next (超前 18-24 個月)**：單顆 GPU TDP 突破物理極限 **1800W-2000W**。矽基板熱點效應使水冷板微通道設計面臨瓶頸，系統架構將全面轉向浸沒式冷卻或先進封裝內嵌式散熱。

**洗牌框架核心結論**：在 Feynman_Next 世代，散熱基建決定算力上限。設備端（CDU、機櫃骨架）的 Design Win 與試產時程，必然領先內部細部元件約 **6 至 9 個月**。T+18 個月為設備端超前 Design Win 的關鍵洗牌時刻，未能跟隨設備端轉型的零組件廠商將面臨訂單歸零之風險。

## 二、 供應鏈內容價值 正反面推演與下世代替代風險警告

在 Feynman_Next 的物理極限下，供應鏈將出現「贏家通吃」與「價值歸零」的兩極化發展。以下針對 Content Value (CV) 變動比率進行定量推演：

### (一) CV 暴漲受惠者：從「接觸式」轉向「系統級與流體力學」
1.  **Sidecar 與 CDU 整合商**：
    *   **演進邏輯**：Vera Rubin 階段 Sidecar 為選配；Feynman_Next 階段單機櫃功耗突破 100kW，具備一體化設計的廠商將從「零組件供應商」躍升為「次系統整合商」。
    *   **CV 變動比率**：單一機櫃散熱內容價值較 Vera Rubin 翻倍成長，預估 **CV 增幅達 +100%**。
2.  **浸沒式冷卻流體與腔體供應商**：
    *   **演進邏輯**：TDP 突破 1800W 使單相/雙相浸沒式冷卻從利基市場轉為 HPC 標配。
    *   **CV 變動比率**：流體化學廠商與浸沒式腔體 ODM 廠迎來爆發性增長，預估 **CV 增幅達 +150% 至 +200%**。
3.  **矽基板與先進封裝內嵌式散熱**：
    *   **演進邏輯**：散熱距離熱源越近越好，具備 TSV 與微通道液冷整合於封裝底座的廠商將取代傳統散熱蓋。
    *   **CV 變動比率**：技術門檻轉化為極高 Content Value，預估 **CV 增幅達 +120%**。

### (二) CV 暴跌/歸零風險：被整合或被物理替代的邊緣者
1.  **傳統氣冷散熱模組與風扇供應商**：
    *   **風險預警**：Feynman_Next 世代風扇能耗比不具經濟效益。
    *   **CV 變動比率**：伺服器散熱 CV 面臨歸零，預估 **CV 衰減達 -100%**。
2.  **獨立水冷板廠商**：
    *   **風險預警**：ODM 廠將強勢主導 Manifold + 水冷板一體化整合，缺乏系統級整合能力者將被邊緣化。
    *   **CV 變動比率**：訂單被大幅壓縮，預估 **CV 衰減達 -60% 至 -80%**。
3.  **傳統導熱介面材料 (TIM) 供應商**：
    *   **風險預警**：無散熱蓋設計或直接晶片液冷將取代散熱膏與導熱墊。
    *   **CV 變動比率**：被金屬焊接或微流體介面取代，預估 **CV 衰減達 -70% 至 -90%**。

        container.innerHTML = DOMPurify.sanitize(marked.parse(rawMarkdown));
        
        // UI/UX 動態排版後處理：將表格內特定文本包裝為漂亮的 Badge
        const tables = container.querySelectorAll('table');
        tables.forEach(table => {
            const rows = table.querySelectorAll('tr');
            rows.forEach(row => {
                const cells = row.querySelectorAll('td, th');
                cells.forEach(cell => {
                    let html = cell.innerHTML;
                    
                    // 1. 股票代碼與中文名稱標籤化 (例如: 3131.弘塑)
                    const stockRegex = /(\b\d{4}\.[\u4e00-\u9fa5]+)/g;
                    html = html.replace(stockRegex, '<span class="stock-tag">$1</span>');
                    
                    // 2. 交易狀態標籤化
                    html = html.replace(/(🛑停損\s*[-+]?\d+(?:\.\d+)?%)/g, '<span class="badge badge-danger">$1</span>');
                    html = html.replace(/(持滿\s*[-+]?\d+(?:\.\d+)?%)/g, '<span class="badge badge-success">$1</span>');
                    html = html.replace(/(🟢 成功\s*\(Win\))/g, '<span class="badge badge-success">$1</span>');
                    html = html.replace(/(🔴 失敗\s*\(Loss\))/g, '<span class="badge badge-danger">$1</span>');
                    html = html.replace(/(🟢 建倉)/g, '<span class="badge badge-success">$1</span>');
                    html = html.replace(/(🟢 追蹤中)/g, '<span class="badge badge-success">$1</span>');
                    html = html.replace(/(🔴 已結案)/g, '<span class="badge badge-danger">$1</span>');
                    
                    // 3. 數值與正負回報率著色
                    const percentRegex = /^\s*([+-]?\d+(?:\.\d+)?%)\s*$/;
                    const match = html.match(percentRegex);
                    if (match) {
                        const pctStr = match[1];
                        if (pctStr.startsWith('+') || parseFloat(pctStr) > 0) {
                            html = `<span style="color: var(--accent-green); font-weight: 700; font-family: 'Fira Code', monospace;">${pctStr}</span>`;
                        } else if (pctStr.startsWith('-') || parseFloat(pctStr) < 0) {
                            html = `<span style="color: var(--accent-red); font-weight: 700; font-family: 'Fira Code', monospace;">${pctStr}</span>`;
                        } else {
                            html = `<span style="color: var(--text-muted); font-family: 'Fira Code', monospace;">${pctStr}</span>`;
                        }
                    }
                    
                    if (html !== cell.innerHTML) {
                        cell.innerHTML = html;
                    }
                });
            });
        });

        // 動態渲染 ApexCharts K 線圖
        const watchlistData = [];
        if (watchlistData && watchlistData.length > 0) {
            watchlistData.forEach(item => {

                            }

                                    borderColor: '#10b981',
                                    style: { color: '#fff', background: '#10b981', fontSize: '11px', padding: [3, 6] },
                                    text: '列入觀察 (' + item.entry_date + ')'
                                }
                            }],
                            points: [{
                                x: entryTime,
                                y: item.entry_price,
                                marker: {
                                    size: 6,
                                    fillColor: '#10b981',
                                    strokeColor: '#fff',
                                    radius: 2
                                },
                                label: {
                                    borderColor: '#10b981',
                                    offsetY: -10,
                                    style: { color: '#fff', background: '#10b981', fontSize: '11px', padding: [3, 6] },
                                    text: '進場點: ' + item.entry_price
                                }
                            }]
                        },
                        tooltip: {
                            theme: 'dark',
                            x: { format: 'yyyy-MM-dd' }
                        }
                    };
                    const chart = new ApexCharts(container, options);
                    chart.render();
                }
            });
        }
