## 一、 技術物理限制與超前 18-24 個月洗牌框架

本板塊因無世代規格登記，不適用 GPU 世代替代框架。針對特殊應用晶片（ASIC）領域，其技術迭代脈絡已脫離單純的製程微縮，轉向系統級架構重構。在未來 18 至 24 個月的技術洗牌週期中，ASIC 板塊面臨三大核心物理限制與演進主軸：

1.  **架構轉變的物理邊界**：從純客製化硬體邏輯，轉向「基礎模型微調 + 可程式化加速陣列」。此轉變突破了單一算力瓶頸，但對記憶體頻寬與邏輯運算的耦合度提出極限要求。
2.  **封裝整合的實體極限**：從單體 ASIC 轉向 2.5D/3D 異質整合（CPU+ASIC+HBM 於同一基板）。隨著晶片面積逼近 Reticle 極限，系統頻寬與功耗的瓶頸已由電晶體微縮轉移至封裝級的矽工程。
3.  **實體層 (PHY) 整合的訊號完整性挑戰**：從離散式 PCIe/乙太網路 Retimer 晶片，轉向 ASIC Die 內原生整合。在 3nm/2nm 節點下，SerDes 訊號衰減與 IR Drop（電壓降）問題迫使高速傳輸 IP 必須進行原生整合。

在此框架下，高頻「Next-Gen Package Equipment Material Index」自 2026 年 5 月中旬落底（146.0）後連續 4 週走揚，至 7 月初已攀升至 157.8（近週變動達 +5.48%，\`catalyst_triggered\` 已觸發）。此實體材料指數的領先翻揚，精確反映了次世代封裝產能在超前 18-24 個月的資本支出已開始實質落地。

## 二、 供應鏈內容價值 正反面推演與下世代替代風險警告

在上述技術迭代脈絡下，價值鏈正發生劇烈的板塊吞併。以下為 Content Value (CV) 變動比率推演：

### 【正面】CV 暴漲廠商：價值向上集中
*   **先進封裝與矽中介層供應商**：封裝已從組裝環節轉變為定義系統頻寬與功耗的「系統級矽工程」。具備 CoWoS/SoIC 等能力的廠商，其 Content Value 從傳統的個位數 %（< 10%），飆升至佔整體 ASIC 硬體成本的 **20%~30% 以上**（CV 變動比率：**+150% 至 +200%**）。
*   **Chiplet 互連 IP 供應商**：大型 ASIC 拆解為多個 Die 的趨勢下，UCIe 等互連標準成為剛需。掌握高速 PHY IP 的廠商，其 IP 授權價值在每顆大型 ASIC 中重複變現，Content Value 隨 Die 數量呈線性擴張（CV 變動比率：**+100% 至 +150%**）。
*   **實體設計自動化 與散熱解決方案商**：針對 IR Drop 與熱點問題，提供多物理場耦合模擬與液冷/浸沒式散熱硬體的廠商，其技術門檻轉化為極高附加價值（CV 變動比率：**+80% 至 +120%**）。

### 【反面】面臨 CV 暴跌或歸零風險廠商：競爭替代與整合危機
*   **獨立 Retimer / 線路重驅晶片供應商**：隨 ASIC 製程推進至 3nm/2nm，原生整合 PCIe Gen6/Gen7 或 CXL PHY 的成本效益將超越外掛獨立晶片。獨立 Retimer 廠商在高端運算 ASIC 板塊的 CV 將面臨「直接歸零」（CV 變動比率：**-100%**）。
*   **傳統離散式電源管理 IC (PMIC) 供應商**：新一代 ASIC 趨向採用多相電源模組或直接將電源管理轉移至封裝內的供電 Die。傳統離散式 PMIC 將被邊緣化（CV 變動比率：**-60% 至 -80%**）。
*   **低階客製化邏輯設計服務廠商**：隨 EDA 工具導入 AI 生成與自動化佈局，加上大型雲端服務商 (CSP) 內部 ASIC 團隊成熟，僅提供基礎 RTL 整合與後段實作的廠商，其附加價值將被「雙重替代」（CV 變動比率：**-50% 至 -70%**）。

        container.innerHTML = DOMPurify.sanitize(marked.parse(rawMarkdown));
        
        // UI/UX 動態排版後處理：將表格內特定文本包裝為漂亮的 Badge
        const tables = container.querySelectorAll('table');
        tables.forEach(table => {
            const rows = table.querySelectorAll('tr');
            rows.forEach(row => {
                const cells = row.querySelectorAll('td, th');
                cells.forEach(cell => {
                    let html = cell.innerHTML;
                    
                    // 1. 股票代碼與中文名稱標籤化 (例如: 3131.弘塑)
                    const stockRegex = /(\b\d{4}\.[\u4e00-\u9fa5]+)/g;
                    html = html.replace(stockRegex, '<span class="stock-tag">$1</span>');
                    
                    // 2. 交易狀態標籤化
                    html = html.replace(/(🛑停損\s*[-+]?\d+(?:\.\d+)?%)/g, '<span class="badge badge-danger">$1</span>');
                    html = html.replace(/(持滿\s*[-+]?\d+(?:\.\d+)?%)/g, '<span class="badge badge-success">$1</span>');
                    html = html.replace(/(🟢 成功\s*\(Win\))/g, '<span class="badge badge-success">$1</span>');
                    html = html.replace(/(🔴 失敗\s*\(Loss\))/g, '<span class="badge badge-danger">$1</span>');
                    html = html.replace(/(🟢 建倉)/g, '<span class="badge badge-success">$1</span>');
                    html = html.replace(/(🟢 追蹤中)/g, '<span class="badge badge-success">$1</span>');
                    html = html.replace(/(🔴 已結案)/g, '<span class="badge badge-danger">$1</span>');
                    
                    // 3. 數值與正負回報率著色
                    const percentRegex = /^\s*([+-]?\d+(?:\.\d+)?%)\s*$/;
                    const match = html.match(percentRegex);
                    if (match) {
                        const pctStr = match[1];
                        if (pctStr.startsWith('+') || parseFloat(pctStr) > 0) {
                            html = `<span style="color: var(--accent-green); font-weight: 700; font-family: 'Fira Code', monospace;">${pctStr}</span>`;
                        } else if (pctStr.startsWith('-') || parseFloat(pctStr) < 0) {
                            html = `<span style="color: var(--accent-red); font-weight: 700; font-family: 'Fira Code', monospace;">${pctStr}</span>`;
                        } else {
                            html = `<span style="color: var(--text-muted); font-family: 'Fira Code', monospace;">${pctStr}</span>`;
                        }
                    }
                    
                    if (html !== cell.innerHTML) {
                        cell.innerHTML = html;
                    }
                });
            });
        });

        // 動態渲染 ApexCharts K 線圖
        const watchlistData = [];
        if (watchlistData && watchlistData.length > 0) {
            watchlistData.forEach(item => {
                const cleanId = 'chart_' + item.company_id.replace('.', '_');
                const container = document.getElementById(cleanId);
                if (container && item.kline_data && item.kline_data.length > 0) {
                    const entryTime = new Date(item.entry_date).getTime();
                    
                    const options = {
                        series: [{
                            name: '收盤價',
                            data: item.kline_data.map(k => [new Date(k.date).getTime(), k.close])
                        }],
                        chart: {
                            type: 'area',
                            height: 240,
                            background: 'transparent',
                            toolbar: { show: false },
                            foreColor: '#94a3b8'
                        },
                        colors: ['#38bdf8'],
                        fill: {
                            type: 'gradient',
                            gradient: {
                                shadeIntensity: 1,
                                opacityFrom: 0.3,
                                opacityTo: 0.05,
                                stops: [0, 90, 100]
                            }
                        },
                        stroke: { curve: 'smooth', width: 2 },
                        xaxis: {
                            type: 'datetime',
                            axisBorder: { show: false },
                            axisTicks: { show: false }
                        },
                        yaxis: {
                            labels: {
                                formatter: (val) => val.toFixed(1)
                            }
                        },
                        grid: { borderColor: 'rgba(255,255,255,0.04)' },
                        annotations: {
                            xaxis: [{
                                x: entryTime,
                                strokeDashArray: 4,
                                borderColor: '#10b981',
                                label: {
                                    borderColor: '#10b981',
                                    style: { color: '#fff', background: '#10b981', fontSize: '11px', padding: [3, 6] },
                                    text: '列入觀察 (' + item.entry_date + ')'
                                }
                            }],
                            points: [{
                                x: entryTime,
                                y: item.entry_price,
                                marker: {
                                    size: 6,
                                    fillColor: '#10b981',
                                    strokeColor: '#fff',
                                    radius: 2
                                },
                                label: {
                                    borderColor: '#10b981',
                                    offsetY: -10,
                                    style: { color: '#fff', background: '#10b981', fontSize: '11px', padding: [3, 6] },
                                    text: '進場點: ' + item.entry_price
                                }
                            }]
                        },
                        tooltip: {
                            theme: 'dark',
                            x: { format: 'yyyy-MM-dd' }
                        }
                    };
                    const chart = new ApexCharts(container, options);
                    chart.render();
                }
            });
        }
    </script>
</body>
</html>
