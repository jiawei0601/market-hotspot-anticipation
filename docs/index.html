## 一、 技術物理限制與超前 18-24 個月 (Feynman_Next) 洗牌框架

當摩爾定律在電晶體微縮端遭遇物理極限，GPU 世代交替的成長動能已全面轉移至 2.5D/3D 先進封裝。在 Vera Rubin 邁向 Feynman，乃至於超前佈局 18-24 個月的下下一代架構 Feynman_Next 的演進軸線上，此技術板塊正經歷一場由「物理極限逼近」所引發的價值量板塊大洗牌。

推動此技術替換的兩大物理瓶頸為「翹曲」與「熱阻抗」。在 Feynman_Next 世代，為解決有機基板在極大面積下的翹曲問題，技術路徑將全面轉向「玻璃基板」與 FOPLP（扇出型面板級封裝）；為解決熱阻抗問題，將引入矽穿孔與散熱微流道。這些物理變革導致技術門檻出現斷層式替換，設備與封測代工的資本支出門檻將飆升至百億台幣起跳，形成不具備破壞式創新能力者將被剔除出 GPU 主路徑的產業洗牌框架。

## 二、 供應鏈內容價值 正反面推演與下世代替代風險警告

在 CoWoS/SoIC 持續微縮並向 FOPLP 與玻璃基板過渡的進程中，供應鏈的 Content Value (CV) 呈現極端 M 型化演進。

### (一) 設備／材料商之 Content Value 演進
1.  **CV 暴漲受惠群（跨世代紅利）：**
    *   **3583 辛耘**與 **3131 弘塑**（蝕刻/去膠/清洗設備）：在 SoIC 混合鍵合間距縮小至個位數微米時，介電層蝕刻與表面處理精度要求指數上升。Feynman_Next 引入散熱微流道將使深矽蝕刻設備 CV 迎來爆發。
    *   **6640 均華**（晶圓接合/微影設備）：FOPLP 核心痛點在於面板級光罩對準精度。當 Feynman_Next 面板尺寸放大至 515x510mm 以上，大面積對準設備的獨占性將使 **6640 均華**的 CV 直接翻倍（預估變動比率達 **+100%**）。
2.  **CV 暴跌/歸零風險群（Feynman_Next 物理變革受害者）：**
    *   傳統打線機與有機基板壓合設備商：當 Feynman_Next 全面轉向玻璃基板時，傳統 BT 基板壓合與機械鑽孔設備的 CV 將面臨 **-100%（歸零）** 風險，技術門檻出現斷層式替換。

### (二) 封測代工（OSAT）之 Content Value 演進
1.  **CV 暴漲受惠群：**
    *   **3711 日月光投控**（FOPLP 與 SoIC 整合者）：具備將 SoIC 與 FOPLP 無縫接軌的系統級封裝能力，其單顆 GPU 封裝代工報價將較 Vera Rubin 世代提升 **+200% 至 +300%**。
    *   **6239 力成**（記憶體邏輯整合與測試）：隨極限 3D 堆疊導入，HBM 與邏輯運算單元距離極限壓縮，測試段 CV 將因良率挑戰加劇而大幅提升。
2.  **CV 暴跌/歸零風險群：**
    *   二線 OSAT（缺乏 FOPLP 與玻璃基板資本支出能力者）：高階 GPU 封裝的 CV 將面臨 **-100%（歸零）** 風險，被迫退守消費性電子與電源管理 IC 領域。傳統 ABF 載板廠若無法掌握玻璃基板表面金屬化製程，將面臨高階訂單流失的毀滅性打擊。

## 四、 預期差與共識度 過濾操作策略

### (一) 排除高共識標的：利好出盡與下世代替代風險
1.  **8027 鈦昇** —— 共識度 88（粗粒度：12 檔樣本，±8 分為雜訊）

2.  **2467 志聖**與 **6223 旺矽** —— 共識度分別為 88 與 79（粗粒度：12 檔樣本，±8 分為雜訊）
    *   營收已爆發，市場對其機械外推情境已有高度預期，營收公布日利好效應遞減，已無潛伏價值。
